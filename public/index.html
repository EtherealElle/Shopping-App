<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A personal tool: keep the hosted copy out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Shopping Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Shopping Tool</h1>
      <button type="button" class="button" id="choose-stores">Stores</button>
      <nav class="tabs" id="category-tabs" aria-label="Category"></nav>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <p class="summary" id="summary" aria-live="polite"></p>
      <label class="control">Sort
        <select id="sort"></select>
      </label>
      <label class="control">Store
        <select id="store-filter"></select>
      </label>
      <button type="button" class="link-button" id="refresh" hidden>Refresh</button>
    </div>
    <div class="grid" id="deals"></div>
    <p class="empty" id="empty" hidden></p>
    <div class="more">
      <button type="button" class="button" id="show-more" hidden>Show more</button>
    </div>
    <p class="footnote" id="footnote" hidden></p>
  </main>

  <dialog id="store-dialog" aria-labelledby="store-dialog-title">
    <form method="dialog">
      <div class="dialog-head">
        <h2 id="store-dialog-title">Stores</h2>
        <button class="button" value="done">Done</button>
      </div>
      <input type="search" id="store-search" placeholder="Search stores" aria-label="Search stores" autocomplete="off">
      <p class="legend">
        Untick a store to hide its deals everywhere.
        <span class="kind kind-live">Live prices</span> are read straight from the store;
        <span class="kind kind-feed">Community deals</span> are posted by shoppers on Slickdeals.
      </p>
      <div id="store-list"></div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
